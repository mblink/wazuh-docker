# Points the stock cert generator at bondlink/config/certs.yml (which sets
# wazuh.master's address to prodops02.bondlink.vpc) instead of multi-node/config/certs.yml.
#
# Usage (from the repo root):
#   docker compose \
#     -f multi-node/generate-indexer-certs.yml \
#     -f bondlink/docker-compose.certs.override.yml \
#     run --rm generator
#
# Output still lands in multi-node/config/wazuh_indexer_ssl_certs/, which is
# where multi-node/docker-compose.yml already expects it.
services:
  generator:
    volumes: !override
      - ../bondlink/config/certs.yml:/config/certs.yml
      - ./config/wazuh_indexer_ssl_certs/:/certificates/
